services:
  eureka-server:
    build: ./eureka-server
    image: eureka-server:v1
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservice-network
  config-server:
    build: ./config-server
    image: config-server:v1
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config # ▲ Points Spring to the container directory
    volumes:
      - ./config-repo:/app/config # ▲ Mounts your local config-repo folder into the container
    networks:
      - microservice-network

  order-service:
    build: ./order-service
    image: order-service:v1
    container_name: order-service
    ports:
      - "8081:8081"
    networks:
      - microservice-network

  payment-service:
    build: ./payment-service
    image: payment-service:v1
    container_name: payment-service
    ports:
      - "8082:8082"
    networks:
      - microservice-network

  api-gateway:
    build: ./api-gateway
    image: api-gateway:v1
    container_name: api-gateway
    ports:
      - "8770:8770"
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge