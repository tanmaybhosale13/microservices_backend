# ===================================================================
# API Gateway Application Infrastructure Definitions
# ===================================================================
spring.application.name=api-gateway-service
server.port=8770

# ===================================================================
# Netflix Eureka Discovery Client Setup
# ===================================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# ===================================================================
# Fixed Spring Cloud Gateway WebFlux Routing Configuration
# ===================================================================

# 1. Order Service Route Configuration
spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**

# 2. Payment Service Route Configuration
spring.cloud.gateway.server.webflux.routes[1].id=payment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/payment/**